spring.application.name=orderservice

server.port=8083

# Database URL (assuming local database and default port)
spring.datasource.url=jdbc:mysql://localhost:3306/orders

# Database Credentials
spring.datasource.username=root
spring.datasource.password=root

# Driver Class (Optional in modern Spring Boot versions)
spring.datasource.driver-class-name=

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create

#Service URLs
service.inventory = http://localhost:8082/api/v1/inventory-service
service.payment = http://localhost:8084/api/v1/payment-service

#Async timeouts
spring.mvc.async.request-timeout=120000
